<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hone Math</title>
<style>
  :root {
    --bg: #F4EEE2; --surface: #FBF7EE; --border: rgba(42,36,28,.14);
    --text: #221D17; --text-muted: #665C4E; --text-faint: #8A7C66;
    --primary: #B4502B;
    --serif: 'Fraunces', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 17px; line-height: 1.62; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 80px 28px 120px; }
  .word { font-family: var(--serif); font-weight: 600; font-size: 44px; letter-spacing: -.5px; margin-bottom: 8px; }
  .sub { color: var(--text-muted); font-size: 18px; margin-bottom: 56px; }
  h2 { font-family: var(--serif); font-weight: 600; font-size: 28px; letter-spacing: -.3px; margin: 56px 0 12px; }
  a { color: var(--primary); text-decoration: none; border-bottom: 1px solid currentColor; }
  a:hover { opacity: .8; }
  .links { display: grid; gap: 16px; margin-top: 40px; }
  .link-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px; }
  .link-card a { border-bottom: none; }
  .link-card .t { font-family: var(--serif); font-weight: 600; font-size: 20px; color: var(--text); }
  .link-card .d { color: var(--text-muted); font-size: 15px; margin-top: 2px; }
  footer { margin-top: 80px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--text-faint); font-size: 14px; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1A1612; --surface: #241F19; --border: rgba(240,229,211,.12); --text: #F1E9DA; --text-muted: #B8AC97; --text-faint: #988B6F; --primary: #D8794E; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <div class="word">Hone Math</div>
  <div class="sub">A mental-math workout for adults. Three minutes a day, an Index that grows with you.</div>

  <div class="links">
    <div class="link-card">
      <a href="./support.html">
        <div class="t">Support</div>
        <div class="d">Common questions, restore purchases, contact us</div>
      </a>
    </div>
    <div class="link-card">
      <a href="./privacy.html">
        <div class="t">Privacy</div>
        <div class="d">What we collect, what we don't, what's stored on your device</div>
      </a>
    </div>
  </div>

  <footer>
    Hone Math is made by TeamAM. Questions: <a href="mailto:contact@teamam.org">contact@teamam.org</a>
  </footer>
</div>
</body>
</html>
